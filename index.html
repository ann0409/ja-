bel": "3", "text": "3D 實體水路分析(3D CFD)"}, {"label": "4", "text": "以上 皆是"}], "answer": "4", "source": "推廣002 (P8)", "page_img": "shuke_18.jpg"}];let pool=[],pos=0,answered=false;let stats=JSON.parse(localStorage.getItem('ja_stats')||'{"right":0,"wrong":0,"mistakes":[]}');let cropAdjustments=JSON.parse(localStorage.getItem('ja_crop_adjustments')||'{}');document.getElementById('total').textContent=QUESTIONS.length;updateStats();function save(){localStorage.setItem('ja_stats',JSON.stringify(stats));updateStats();}function updateStats(){right.textContent=stats.right;wrong.textContent=stats.wrong;let t=stats.right+stats.wrong;rate.textContent=t?Math.round(stats.right/t*100)+'%':'0%';mistakeCount.textContent=stats.mistakes.length;}function start(){let s=subject.value;if(s==='mistakes'){pool=QUESTIONS.filter(q=>stats.mistakes.includes(q.id));if(!pool.length){alert('目前沒有錯題，太強了！🎉');return;}}else{pool=QUESTIONS.filter(q=>s==='all'||q.subject===s);}if(mode.value==='random')pool=pool.sort(()=>Math.random()-0.5);pos=0;show();}function show(){answered=false;let q=pool[pos];if(!q)return;meta.textContent=q.subject+'｜原第 '+q.original_no+' 題｜第 '+q.page+' 頁';src.textContent=q.source||'';num.textContent=(pos+1)+' / '+pool.length;prog.style.width=((pos)/Math.max(pool.length,1)*100)+'%';qtext.textContent=q.question||'（此題題幹可能在原圖中，請按查看本題圖片）';opts.innerHTML='';let options=q.options.length?q.options:[1,2,3,4,5].map(n=>({label:String(n),text:'選項 '+n+'（請看原題頁面圖片）'}));options.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o.label+'. '+o.text;b.onclick=()=>answer(o.label,b);opts.appendChild(b);});explain.style.display='none';
let hasPic=isImageQuestion(q);
// 純文字題：不顯示圖片提示、不顯示圖片框、不顯示「查看本題圖片」按鈕。
const imgBtn=document.getElementById('imgBtn');
if(imgBtn) imgBtn.style.display=hasPic?'inline-block':'none';
const imageAdjustControls=document.getElementById('imageAdjustControls');
if(imageAdjustControls) imageAdjustControls.style.display=hasPic?'flex':'none';
// 換題時先把圖片區清乾淨，避免上一題的空白框或圖片殘留。
prepareQuestionImage(q,hasPic);
if(document.getElementById('imgNote')){
  imgNote.style.display=hasPic?'block':'none';
  imgNote.textContent='📌 這題有圖片/圖表，圖片會顯示在題目下方，像原題一樣。';
}
}
function isImageQuestion(q){return /下圖|圖示|圖表|箭頭|曲線|哪一個點|哪個點|哪一個區域|哪個區域|圖中|根據圖|如圖|A\\)|B\\)|C\\)|D\\)/.test(q.question||'') || (q.options||[]).length===0;}
function sameImageQuestions(q){return QUESTIONS.filter(x=>x.page_img===q.page_img).sort((a,b)=>a.id-b.id);}
function prepareQuestionImage(q,showIt){
  const wrap=document.getElementById('cropWrap');
  if(!wrap)return;
  if(!showIt){wrap.style.display='none';pageImg.removeAttribute('src');pageImg.style.transform='';return;}
  wrap.style.display='block';
  pageImg.style.display='block';
  pageImg.onerror=()=>{wrap.style.display='none';if(document.getElementById('imgNote')){imgNote.style.display='block';imgNote.textContent='⚠️ 圖片沒有載入，請確認圖片檔與 index.html 放在同一層，且檔名大小寫要完全相同。';}};
  pageImg.onload=()=>cropToCurrentQuestion(q);
  if(pageImg.getAttribute('data-src')!==q.page_img){pageImg.setAttribute('data-src',q.page_img);pageImg.src=q.page_img;}else{setTimeout(()=>cropToCurrentQuestion(q),30);}
}
function cropToCurrentQuestion(q){
  const wrap=document.getElementById('cropWrap');
  if(!wrap||!pageImg.naturalWidth||!pageImg.naturalHeight)return;
  const list=sameImageQuestions(q);
  const idx=Math.max(0,list.findIndex(x=>x.id===q.id));
  const count=Math.max(1,list.length);
  const baseW=wrap.clientWidth || wrap.parentElement.clientWidth || 760;
  const adj=cropAdjustments[q.id]||{dy:0,dh:0,zoom:1};
  const zoom=Math.max(0.75,Math.min(1.75,adj.zoom||1));
  const w=baseW*zoom;
  const fullH=w*(pageImg.naturalHeight/pageImg.naturalWidth);

  // 讓圖片像原題：題幹下方直接顯示較大的圖區，不要切太小。
  const segmentH=fullH/count;
  const context=Math.max(150, segmentH*1.05);
  let h=Math.max(360, Math.min(segmentH + context*2 + (adj.dh||0), Math.min(980, fullH)));
  let center=(idx+0.5)*segmentH + (adj.dy||0);
  let y=Math.max(0, center - h/2);
  if(y+h>fullH) y=Math.max(0, fullH-h);

  wrap.style.height=h+'px';
  pageImg.style.width=w+'px';
  pageImg.style.height='auto';
  pageImg.style.transform='translateX('+((baseW-w)/2)+'px) translateY(-'+y+'px)';
}
function saveCropAdjustments(){localStorage.setItem('ja_crop_adjustments',JSON.stringify(cropAdjustments));}
function currentQuestion(){return pool&&pool[pos];}
function adjustCrop(dy,dh,dz){
  const q=currentQuestion(); if(!q)return;
  const adj=cropAdjustments[q.id]||{dy:0,dh:0,zoom:1};
  adj.dy=(adj.dy||0)+dy;
  adj.dh=Math.max(-180,Math.min(500,(adj.dh||0)+dh));
  adj.zoom=Math.max(0.75,Math.min(1.6,(adj.zoom||1)+dz));
  cropAdjustments[q.id]=adj;
  saveCropAdjustments();
  cropToCurrentQuestion(q);
}
function resetCrop(){
  const q=currentQuestion(); if(!q)return;
  delete cropAdjustments[q.id];
  saveCropAdjustments();
  cropToCurrentQuestion(q);
}

window.addEventListener('resize',()=>{let q=pool&&pool[pos];if(q&&isImageQuestion(q))cropToCurrentQuestion(q);});
function answer(a,btn){if(answered)return;answered=true;let q=pool[pos];let ok=a===q.answer;[...opts.children].forEach(b=>{if(b.textContent.startsWith(q.answer+'.'))b.classList.add('correct');});if(!ok)btn.classList.add('wrong');explain.innerHTML=ok?'✅ 答對了！':'❌ 答錯了，正確答案是：<b>'+q.answer+'</b>';explain.style.display='block';if(ok){stats.right++;stats.mistakes=stats.mistakes.filter(id=>id!==q.id);}else{stats.wrong++;if(!stats.mistakes.includes(q.id))stats.mistakes.push(q.id);}save();}function nextQ(){if(!pool.length)return start();pos=(pos+1)%pool.length;show();}function prevQ(){if(!pool.length)return;pos=(pos-1+pool.length)%pool.length;show();}function togglePage(){let q=pool&&pool[pos];let wrap=document.getElementById('cropWrap');if(!q||!wrap)return;let show=wrap.style.display==='none';const imageAdjustControls=document.getElementById('imageAdjustControls');if(show){prepareQuestionImage(q,true);if(imageAdjustControls)imageAdjustControls.style.display='flex';if(document.getElementById('imgNote'))imgNote.style.display='block';}else{wrap.style.display='none';if(imageAdjustControls)imageAdjustControls.style.display='none';if(document.getElementById('imgNote'))imgNote.style.display='none';}}function resetStats(){if(confirm('確定清空答題紀錄和錯題本？')){stats={right:0,wrong:0,mistakes:[]};save();}}function exportMistakes(){
  let rows=QUESTIONS.filter(q=>stats.mistakes.includes(q.id)).map(q=>'['+q.subject+'] 第'+q.original_no+'題 答案:'+q.answer+'\n'+q.question+'\n');
  let blob=new Blob([rows.join('\n')],{type:'text/plain;charset=utf-8'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='JA錯題本.txt';
  a.click();
}
</script></body></html>
